name: Publish package feed

# Builds the default ca9 feed hourly and publishes it to the `feed` branch as
# latest.json; the OSV malware datasets are rebuilt every 6 hours by default.
# `ca9 feed update` (zero-arg) points at:
#   https://raw.githubusercontent.com/duriantaco/ca9/feed/latest.json
#
# The build job runs third-party code (pip, the feed builder, the sentinel) with a
# read-only token. Only the publish job can write, and it runs no project code. Each
# published bundle carries a GitHub artifact attestation signed by this
# workflow. `ca9 feed update --require-attestation` checks it with:
#   gh attestation verify latest.json --repo duriantaco/ca9 \
#     --cert-identity https://github.com/duriantaco/ca9/.github/workflows/feed.yml@refs/heads/main \
#     --source-ref refs/heads/main --deny-self-hosted-runners

on:
  schedule:
    - cron: "17 * * * *" # hourly, at minute 17
  workflow_dispatch:
    inputs:
      osv_rebuild_hours:
        description: "Rebuild the OSV datasets when the published ones are this many hours old (0 = now)"
        required: false
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ca9 (provides the `packaging` dependency)
        run: pip install -e .

      - name: Fetch previous manifest and bundle (collapse guard, sentinel watermark)
        run: |
          set -eu
          mkdir -p feed_build
          git fetch origin feed || true
          git show origin/feed:manifest.json > feed_build/prev-manifest.json 2>/dev/null \
            || echo '{}' > feed_build/prev-manifest.json
          git show origin/feed:latest.json > feed_build/prev-latest.json 2>/dev/null \
            || rm -f feed_build/prev-latest.json

      - name: Build feed bundle (OSV datasets reused from the previous bundle until due)
        env:
          CA9_OSV_REBUILD_HOURS: ${{ inputs.osv_rebuild_hours || vars.CA9_OSV_REBUILD_HOURS || '6' }}
        run: |
          set -euo pipefail
          python scripts/build_feed.py \
            -o feed_build/latest.json \
            --manifest feed_build/manifest.json \
            --min-malware 100 \
            --compare-manifest feed_build/prev-manifest.json \
            --previous feed_build/prev-latest.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Review new releases of popular packages (sentinel, static and read-only)
        run: |
          set -euo pipefail
          python scripts/sentinel.py run \
            --previous feed_build/prev-latest.json \
            --bundle feed_build/latest.json \
            --manifest feed_build/manifest.json \
            --time-budget-minutes 30 | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f feed_build/prev-latest.json

      - name: Upload feed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-bundle
          path: |
            feed_build/latest.json
            feed_build/manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download feed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-bundle
          path: feed_build

      - name: Attest feed bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: feed_build/latest.json

      - name: Publish to the feed branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Publish a fresh single-commit `feed` branch (data branch; history not kept).
          workdir="$(mktemp -d)"
          cp feed_build/latest.json feed_build/manifest.json "$workdir/"
          cd "$workdir"
          git init -q
          git checkout -q -b feed
          git add latest.json manifest.json
          git -c user.name="ca9-feed-bot" \
              -c user.email="ca9-feed-bot@users.noreply.github.com" \
              commit -qm "feed: update $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feed
