name: ca9 Supply Chain Security
description: Review dependency updates, check protection posture, and triage CVE reachability in GitHub Actions
author: duriantaco

branding:
  icon: shield
  color: purple

inputs:
  command:
    description: ca9 command to run. Use scan, check, protect, or review. Review runs on a pull_request event.
    required: false
    default: scan
  report:
    description: SCA report path. Required when command is check.
    required: false
    default: ""
  repo:
    description: Repository path to analyze. For review, use a checkout inside GITHUB_WORKSPACE with both PR commits available.
    required: false
    default: "."
  policy:
    description: Package policy TOML path for command protect.
    required: false
    default: ""
  scan-workflows:
    description: Scan local GitHub Actions workflows when command is protect.
    required: false
    default: "true"
  update-feed:
    description: >-
      Install the hosted ca9 malware feed before command protect. The bundle is
      checked with `gh attestation verify` against the ca9 feed workflow, and the
      step fails if it cannot be verified.
    required: false
    default: "true"
  coverage:
    description: coverage.py JSON path for dynamic evidence.
    required: false
    default: ""
  format:
    description: >-
      Review supports json (default) and markdown. Other commands default to sarif.
      Scan and check also support json, vex, remediation, action-plan, markdown,
      html, and table. Protect also supports json, markdown, and table.
    required: false
    default: ""
  output:
    description: Output file path. Review defaults to ca9-review.json or ca9-review.md. Other commands default to ca9.sarif.
    required: false
    default: ""
  proof-standard:
    description: "Proof policy for suppressions: strict or balanced."
    required: false
    default: strict
  capabilities:
    description: Attach AI capability blast radius to reachable CVEs.
    required: false
    default: "false"
  trace-paths:
    description: Trace exploit paths from entry points to vulnerable call sites.
    required: false
    default: "false"
  threat-intel:
    description: Enrich with EPSS scores and CISA KEV data.
    required: false
    default: "false"
  otel-traces:
    description: OTLP JSON export for production runtime evidence.
    required: false
    default: ""
  auto-coverage:
    description: Discover coverage.json in the repo, or run the repo's pytest suite to generate it. This executes repository code.
    required: false
    default: "false"
  no-auto-coverage:
    description: Deprecated; automatic coverage is already off by default. Kept for compatibility, and overrides auto-coverage when true.
    required: false
    default: "false"
  accepted-risks:
    description: Accepted-risk TOML/JSON file for findings that should not affect gates.
    required: false
    default: ""
  baseline:
    description: Previous ca9 JSON report for new-only gating.
    required: false
    default: ""
  new-only:
    description: Gate on new reachable or inconclusive findings and findings that became reachable since the baseline.
    required: false
    default: "false"
  upload-sarif:
    description: Upload SARIF output to GitHub code scanning when format is sarif.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail on a nonzero findings exit code, including a dependency review that needs attention. Execution errors always fail.
    required: false
    default: "false"
  extra-args:
    description: Additional ca9 CLI arguments split on shell whitespace.
    required: false
    default: ""

outputs:
  exit-code:
    description: ca9 exit code.
    value: ${{ steps.ca9.outputs.exit-code }}
  output-path:
    description: Path to the report produced by this run.
    value: ${{ steps.ca9.outputs.report-written == 'true' && (steps.ca9.outputs.output-path || inputs.output || 'ca9.sarif') || '' }}

runs:
  using: composite
  steps:
    - name: Install ca9
      shell: bash
      run: python -m pip install "${{ github.action_path }}[cli]"

    - name: Update ca9 feed (attested)
      if: inputs.command == 'protect' && inputs.update-feed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ca9 feed update --require-attestation

    - name: Run ca9
      id: ca9
      shell: bash
      env:
        CA9_COMMAND: ${{ inputs.command }}
        CA9_REPORT: ${{ inputs.report }}
        CA9_REPO: ${{ inputs.repo }}
        CA9_POLICY: ${{ inputs.policy }}
        CA9_SCAN_WORKFLOWS: ${{ inputs.scan-workflows }}
        CA9_COVERAGE: ${{ inputs.coverage }}
        CA9_FORMAT: ${{ inputs.format }}
        CA9_OUTPUT: ${{ inputs.output }}
        CA9_PROOF_STANDARD: ${{ inputs.proof-standard }}
        CA9_CAPABILITIES: ${{ inputs.capabilities }}
        CA9_TRACE_PATHS: ${{ inputs.trace-paths }}
        CA9_THREAT_INTEL: ${{ inputs.threat-intel }}
        CA9_OTEL_TRACES: ${{ inputs.otel-traces }}
        CA9_AUTO_COVERAGE: ${{ inputs.auto-coverage }}
        CA9_NO_AUTO_COVERAGE: ${{ inputs.no-auto-coverage }}
        CA9_ACCEPTED_RISKS: ${{ inputs.accepted-risks }}
        CA9_BASELINE: ${{ inputs.baseline }}
        CA9_NEW_ONLY: ${{ inputs.new-only }}
        CA9_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -u

        if [[ "$CA9_COMMAND" == "review" ]]; then
          exec python "$GITHUB_ACTION_PATH/scripts/run_pr_review.py"
        fi
        if [[ "$CA9_COMMAND" != "scan" && "$CA9_COMMAND" != "check" && "$CA9_COMMAND" != "protect" ]]; then
          echo "command must be 'scan', 'check', 'protect', or 'review'" >&2
          exit 64
        fi

        export CA9_FORMAT="${CA9_FORMAT:-sarif}"
        export CA9_OUTPUT="${CA9_OUTPUT:-ca9.sarif}"
        cmd=("$CA9_COMMAND")
        if [[ "$CA9_COMMAND" == "check" ]]; then
          if [[ -z "$CA9_REPORT" ]]; then
            echo "report is required when command is 'check'" >&2
            exit 64
          fi
          cmd+=("$CA9_REPORT")
        fi

        cmd+=(--repo "$CA9_REPO")

        if [[ "$CA9_COMMAND" == "protect" ]]; then
          if [[ -n "$CA9_POLICY" ]]; then
            cmd+=(--policy "$CA9_POLICY")
          fi
          if [[ "$CA9_SCAN_WORKFLOWS" == "false" ]]; then
            cmd+=(--no-scan-workflows)
          fi
        else
          cmd+=(--proof-standard "$CA9_PROOF_STANDARD")
          if [[ -n "$CA9_COVERAGE" ]]; then
            cmd+=(--coverage "$CA9_COVERAGE")
          fi
          if [[ "$CA9_NO_AUTO_COVERAGE" == "true" ]]; then
            cmd+=(--no-auto-coverage)
          elif [[ "$CA9_AUTO_COVERAGE" == "true" ]]; then
            cmd+=(--auto-coverage)
          fi
          if [[ -n "$CA9_ACCEPTED_RISKS" ]]; then
            cmd+=(--accepted-risks "$CA9_ACCEPTED_RISKS")
          fi
          if [[ -n "$CA9_BASELINE" ]]; then
            cmd+=(--baseline "$CA9_BASELINE")
          fi
          if [[ "$CA9_NEW_ONLY" == "true" ]]; then
            cmd+=(--new-only)
          fi
          if [[ "$CA9_CAPABILITIES" == "true" ]]; then
            cmd+=(--capabilities)
          fi
          if [[ "$CA9_TRACE_PATHS" == "true" ]]; then
            cmd+=(--trace-paths)
          fi
          if [[ "$CA9_THREAT_INTEL" == "true" ]]; then
            cmd+=(--threat-intel)
          fi
          if [[ -n "$CA9_OTEL_TRACES" ]]; then
            cmd+=(--otel-traces "$CA9_OTEL_TRACES")
          fi
        fi
        if [[ -n "$CA9_EXTRA_ARGS" ]]; then
          IFS=$' \t\r' read -r -a extra_args <<< "${CA9_EXTRA_ARGS//$'\n'/ }"
          cmd+=("${extra_args[@]}")
        fi

        python "$GITHUB_ACTION_PATH/scripts/run_action.py" "${cmd[@]}" -f "$CA9_FORMAT"

    - name: Upload SARIF
      if: inputs.command != 'review' && inputs.upload-sarif == 'true' && (inputs.format == '' || inputs.format == 'sarif') && steps.ca9.outputs.report-written == 'true'
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        sarif_file: ${{ inputs.output || 'ca9.sarif' }}

    - name: Enforce ca9 result
      if: inputs.fail-on-findings == 'true' && steps.ca9.outputs.exit-code != '0'
      shell: bash
      run: exit "${{ steps.ca9.outputs.exit-code }}"
